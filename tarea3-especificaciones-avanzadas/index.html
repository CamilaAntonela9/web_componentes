<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modal ESPE</title>
  <script type="module">
    import './componentes/espe-modal.js';

    function abrirModal() {
      const modal = document.createElement("espe-modal");

      modal.innerHTML = `
        <span slot="title">Bienvenido a ESPE</span>
        <div slot="content">
          <p>Este es un contenido dentro del modal con estilo juvenil y los colores institucionales de ESPE.</p>
        </div>
      `;

      modal.addEventListener("modal-cerrado", () => {
        console.log("El modal fue cerrado");
      });

      document.body.appendChild(modal);
    }

    window.abrirModal = abrirModal;
  </script>
</head>
<body>
  <h1>Componentes Avanzados ESPE</h1>
  <button onclick="abrirModal()">Abrir Modal</button>
</body>
</html>
